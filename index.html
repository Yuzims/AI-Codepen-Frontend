<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 代码编辑器前端</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      .layout {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
      }
      .panel {
        padding: 16px;
      }
      .panel + .panel {
        border-left: 1px solid #1e293b;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 12px;
        color: #94a3b8;
      }
      textarea {
        width: 100%;
        border: 1px solid #334155;
        border-radius: 8px;
        background: #020617;
        color: #f8fafc;
        padding: 10px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      #promptInput {
        min-height: 70px;
        margin-bottom: 12px;
      }
      #codeEditor {
        min-height: 360px;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        color: #0f172a;
        background: #38bdf8;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #cbd5e1;
      }
      iframe {
        width: 100%;
        height: calc(100vh - 120px);
        border: 1px solid #334155;
        border-radius: 8px;
        background: #fff;
      }
      .hint {
        margin-top: 8px;
        font-size: 13px;
        color: #94a3b8;
      }
      @media (max-width: 960px) {
        .layout {
          grid-template-columns: 1fr;
        }
        iframe {
          height: 50vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <section class="panel">
        <h1>AI 代码编辑器前端</h1>
        <p>输入需求，让前端模拟 AI 生成代码，然后一键运行预览。</p>

        <label for="promptInput">需求描述</label>
        <textarea id="promptInput" placeholder="例如：做一个带按钮和渐变背景的欢迎卡片"></textarea>

        <div class="actions">
          <button id="generateButton" type="button">AI 生成代码</button>
          <button id="runButton" class="secondary" type="button">运行预览</button>
        </div>

        <label for="codeEditor">代码编辑区（HTML/CSS/JS）</label>
        <textarea id="codeEditor"></textarea>
        <div class="hint">提示：你可以在编辑区继续手动修改，再点击“运行预览”。</div>
      </section>

      <section class="panel">
        <h1>实时预览</h1>
        <iframe id="previewFrame" title="preview"></iframe>
      </section>
    </div>

    <script>
      const promptInput = document.getElementById("promptInput");
      const codeEditor = document.getElementById("codeEditor");
      const generateButton = document.getElementById("generateButton");
      const runButton = document.getElementById("runButton");
      const previewFrame = document.getElementById("previewFrame");

      const defaultCode = `<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { font-family: sans-serif; padding: 24px; background:#f8fafc; }
      .card { max-width:420px; padding:20px; border-radius:12px; background:#fff; box-shadow:0 10px 25px rgba(0,0,0,.08); }
      h2 { margin-top:0; }
      button { padding:8px 12px; border:0; border-radius:8px; background:#2563eb; color:#fff; cursor:pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>欢迎使用 AI 代码编辑器</h2>
      <p>这是默认模板，你可以生成或编辑它。</p>
      <button onclick="alert('你好，世界！')">点我</button>
    </div>
  </body>
</html>`;

      function generateCode(prompt) {
        const escapedPrompt = (prompt || "创建一个欢迎卡片").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        return `<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:sans-serif; background:linear-gradient(135deg, #dbeafe, #e9d5ff); }
      .app { width:min(520px, 90vw); padding:24px; border-radius:14px; background:#ffffffcc; box-shadow:0 12px 30px rgba(30,41,59,.15); }
      h2 { margin:0 0 10px; color:#1e293b; }
      p { margin:0 0 12px; color:#334155; line-height:1.6; }
      button { border:0; border-radius:10px; padding:10px 14px; background:#0ea5e9; color:white; cursor:pointer; }
    </style>
  </head>
  <body>
    <div class="app">
      <h2>AI 生成结果</h2>
      <p>你的需求：${escapedPrompt}</p>
      <button onclick="document.body.style.filter='hue-rotate(30deg)'">试试交互</button>
    </div>
  </body>
</html>`;
      }

      function runPreview() {
        const doc = previewFrame.contentDocument || previewFrame.contentWindow.document;
        doc.open();
        doc.write(codeEditor.value);
        doc.close();
      }

      generateButton.addEventListener("click", () => {
        codeEditor.value = generateCode(promptInput.value.trim());
        runPreview();
      });

      runButton.addEventListener("click", runPreview);

      codeEditor.value = defaultCode;
      runPreview();
    </script>
  </body>
</html>
